name: Publish

# Trusted publishing (OIDC) — no token stored. Requires the repo and this
# filename to be registered on the package at npmjs.com.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure a new enough npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Tag must match package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || {
            echo "::error::Release tag $TAG does not match package.json $PKG"
            exit 1
          }

      - run: npm run build
      - run: npm test
      - run: npm run audit:docs

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --access public

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
