name: Publish

# Publishes to npm via trusted publishing (OIDC). No token is stored anywhere:
# GitHub mints a short-lived credential that npm trusts because this exact
# repository and workflow filename are registered on the package.
#
# npm generates a provenance attestation automatically for this path, so the
# published version is cryptographically linked back to this commit and run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; do not rely on whatever Node ships.
      - name: Ensure a new enough npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # A release tag that disagrees with package.json means the wrong code is
      # about to go out under the right name.
      - name: Tag must match package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || {
            echo "::error::Release tag $TAG does not match package.json $PKG"
            exit 1
          }

      # prepublishOnly also runs build + test + audit:docs, but running them
      # here means a failure is reported against its own step.
      - run: npm run build
      - run: npm test
      - run: npm run audit:docs

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --access public

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --access public --dry-run
