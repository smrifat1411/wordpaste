<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordpaste + Lexical</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
      p.sub { margin: 0 0 1.25rem; color: #71717a; }
      a { color: #059669; }
      #editor {
        min-height: 180px; padding: 1rem; border: 1px solid #d4d4d8;
        border-radius: 10px; outline: none;
      }
      #editor p { margin: 0 0 .7em; }
      pre {
        margin-top: 1.75rem; padding: 1rem; overflow-x: auto;
        background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px;
        font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .warn { font-size: .9rem; color: #b45309; }
      @media (prefers-color-scheme: dark) {
        #editor { border-color: #3f3f46; }
        pre { background: #18181b; border-color: #27272a; }
        p.sub { color: #a1a1aa; }
        .warn { color: #fbbf24; }
      }
    </style>
  </head>
  <body>
    <h1>wordpaste + Lexical</h1>
    <p class="sub">
      Copy from Word and paste below. <a href="../">Back to the playground</a>
    </p>

    <div id="editor" contenteditable="true"></div>

    <p class="warn">
      Note: this uses Lexical's default rich-text nodes, which have no maths
      node — so an equation lands as its LaTeX text. Rendering it is your
      node set's business. The Tiptap example shows the rendered version.
    </p>

    <pre id="code"></pre>

    <script type="module">
      import {
        createEditor, PASTE_COMMAND, COMMAND_PRIORITY_HIGH, $getRoot, $insertNodes,
      } from 'https://esm.sh/lexical@0.49';
      import { registerRichText, HeadingNode, QuoteNode } from 'https://esm.sh/@lexical/rich-text@0.49';
      import { $generateNodesFromDOM } from 'https://esm.sh/@lexical/html@0.49';
      import { registerHistory, createEmptyHistoryState } from 'https://esm.sh/@lexical/history@0.49';
      import { transformPastedHTML } from 'https://esm.sh/wordpaste@0.8.0';

      const editor = createEditor({
        namespace: 'wordpaste-example',
        nodes: [HeadingNode, QuoteNode],
        onError: (e) => console.error(e),
      });
      editor.setRootElement(document.getElementById('editor'));
      registerRichText(editor);
      registerHistory(editor, createEmptyHistoryState(), 300);

      editor.registerCommand(
        PASTE_COMMAND,
        (event) => {
          const html = event.clipboardData?.getData('text/html');
          if (!html) return false;

          event.preventDefault();
          const clean = transformPastedHTML(html);
          const dom = new DOMParser().parseFromString(clean, 'text/html');

          editor.update(() => {
            $getRoot().selectEnd();
            $insertNodes($generateNodesFromDOM(editor, dom));
          });
          return true;
        },
        COMMAND_PRIORITY_HIGH,
      );

      document.getElementById('code').textContent = `import { PASTE_COMMAND, COMMAND_PRIORITY_HIGH, $getRoot, $insertNodes } from 'lexical';
import { $generateNodesFromDOM } from '@lexical/html';
import { transformPastedHTML } from 'wordpaste';

editor.registerCommand(
  PASTE_COMMAND,
  (event) => {
    const html = event.clipboardData?.getData('text/html');
    if (!html) return false;

    event.preventDefault();
    const dom = new DOMParser().parseFromString(transformPastedHTML(html), 'text/html');

    editor.update(() => {
      $getRoot().selectEnd();
      $insertNodes($generateNodesFromDOM(editor, dom));
    });
    return true;
  },
  COMMAND_PRIORITY_HIGH,
);`;
    </script>
  </body>
</html>
