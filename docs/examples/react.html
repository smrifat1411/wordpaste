<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordpaste + React</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
      p.sub { margin: 0 0 1.25rem; color: #71717a; }
      a { color: #059669; }
      .box { min-height: 180px; padding: 1rem; border: 1px solid #d4d4d8; border-radius: 10px; }
      .tiptap { outline: none; }
      .tiptap p { margin: 0 0 .7em; }
      button {
        font: inherit; font-size: .88rem; padding: .35rem .8rem; margin: .9rem .4rem 0 0;
        border: 1px solid #d4d4d8; border-radius: 7px; background: transparent;
        color: inherit; cursor: pointer;
      }
      pre {
        margin-top: 1.75rem; padding: 1rem; overflow-x: auto;
        background: #fafafa; border: 1px solid #e4e4e7; border-radius: 10px;
        font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        .box, button { border-color: #3f3f46; }
        pre { background: #18181b; border-color: #27272a; }
        p.sub { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <h1>wordpaste + React</h1>
    <p class="sub">
      Real React, no build step. React is the framework; Tiptap is the editor —
      wordpaste plugs into the editor, not the framework.
      <a href="../">Back to the playground</a>
    </p>

    <div id="root"></div>
    <pre id="code"></pre>

    <script type="module">
      import React from 'https://esm.sh/react@19';
      import { createRoot } from 'https://esm.sh/react-dom@19/client';
      import { useEditor, EditorContent } from 'https://esm.sh/@tiptap/react@3?deps=react@19,react-dom@19';
      import StarterKit from 'https://esm.sh/@tiptap/starter-kit@3';
      import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@3';
      import * as mathMod from 'https://esm.sh/@tiptap/extension-mathematics@3';
      import { transformPastedHTML } from 'https://esm.sh/wordpaste@0.7.0';

      const Mathematics = mathMod.Mathematics ?? mathMod.default;
      const h = React.createElement;

      const SAMPLE =
        '<html xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math">' +
        '<p class=MsoNormal style="text-align:center;font-family:Calibri">' +
        'Darcy&#8211;Weisbach head loss<o:p></o:p></p>' +
        '<p class=MsoNormal><m:oMath><m:sSub><m:e><m:r>Z</m:r></m:e><m:sub><m:r>A</m:r></m:sub></m:sSub>' +
        '<m:r>=f</m:r><m:f><m:num><m:r>L</m:r><m:sSup><m:e><m:r>V</m:r></m:e><m:sup><m:r>2</m:r></m:sup>' +
        '</m:sSup></m:num><m:den><m:r>2gD</m:r></m:den></m:f></m:oMath>' +
        '<img src="file:///C:/Users/me/clip_image001.png"><o:p></o:p></p></html>';

      function WordEditor() {
        const editor = useEditor({
          extensions: [
            StarterKit,
            Mathematics,
            TextAlign.configure({ types: ['heading', 'paragraph'] }),
          ],
            editorProps: { transformPastedHTML },
          content: '<p>Paste from Word here…</p>',
        });

        return h(
          React.Fragment,
          null,
          h(EditorContent, { editor, className: 'box' }),
          h(
            'button',
            {
              id: 'sample',
              onClick: () => editor?.commands.setContent(transformPastedHTML(SAMPLE)),
            },
            'Load a Word sample',
          ),
        );
      }

      createRoot(document.getElementById('root')).render(h(WordEditor));

      document.getElementById('code').textContent = `'use client';

import { useEditor, EditorContent } from '@tiptap/react';
import StarterKit from '@tiptap/starter-kit';
import { transformPastedHTML } from 'wordpaste';

export function WordEditor() {
  const editor = useEditor({
    extensions: [StarterKit],
    editorProps: { transformPastedHTML },
    content: '<p>Paste from Word here…</p>',
  });

  return <EditorContent editor={editor} />;
}

// Next.js: 'use client' matters. wordpaste is safe to IMPORT on the server,
// but calling it there throws "DOMParser is not defined".`;
    </script>
  </body>
</html>
